# Trivy 0.76.0 Configuration for Hotel Premium
format: "table"
severity:
  - "HIGH"
  - "CRITICAL"
exit-code: 1
ignore-unfixed: true

scan:
  scanners:
    - "vuln"
    - "misconfig"
    - "secret"
    - "license"

misconfiguration:
  scanners:
    - "terraform"
    - "kubernetes"
    - "dockerfile"

secret:
  config: "devsecops/sast/gitleaks/.gitleaks.toml"
