env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - https://compete-give-broadband-regular.trycloudflare.com
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 1
    url: https://compete-give-broadband-regular.trycloudflare.com
  type: spider
- parameters:
    maxDuration: 0
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules:
  - action: WARN
    customMessage: ''
    id: 10020
  - action: WARN
    customMessage: ''
    id: 10021
  - action: IGNORE
    customMessage: ''
    id: 10036
  - action: IGNORE
    customMessage: ''
    id: 10038
  - action: IGNORE
    customMessage: ''
    id: 10049
  - action: WARN
    customMessage: ''
    id: 10055
  - action: INFO
    customMessage: ''
    id: 10063
  - action: IGNORE
    customMessage: ''
    id: 10096
  - action: WARN
    customMessage: ''
    id: 10098
  - action: INFO
    customMessage: ''
    id: 10109
  - action: INFO
    customMessage: ''
    id: 90003
  - action: INFO
    customMessage: ''
    id: 90004
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: zap-report.html
    reportTitle: ZAP Scanning Report
    template: traditional-html
  type: report
