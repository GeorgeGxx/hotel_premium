apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredResources
metadata:
  name: enforce-pod-resource-limits
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - "dev"
      - "auth"
      - "data"
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sTrustedRegistries
metadata:
  name: enforce-trusted-registries
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - "dev"
      - "auth"
      - "data"
  parameters:
    registries:
      - "georgegxx/"
      - "docker.io"
      - "kong:"
      - "postgres:"
      - "redis:"
      - "confluentinc/"
      - "prometheuscommunity/"
      - "oliver006/"
      - "danielqsj/"
      - "istio/"
      - "registry.k8s.io"
      - "ghcr.io"
      - "quay.io"
      - "us-central1-docker.pkg.dev/"
      - "docker.pkg.dev/"
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDisallowRoot
metadata:
  name: enforce-disallow-root
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - "dev"
      - "hotel-staging"
      - "hotel-prod"
