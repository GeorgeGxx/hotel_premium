apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredresources
  annotations:
    description: "Requires all containers to have CPU and memory limits and requests specified."
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredResources
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredresources

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not has_resources(container)
          msg := sprintf("Container '%v' in pod '%v' must have CPU and memory requests and limits defined.", [container.name, input.review.object.metadata.name])
        }

        has_resources(container) {
          container.resources.limits.cpu
          container.resources.limits.memory
          container.resources.requests.cpu
          container.resources.requests.memory
        }
