apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8strustedregistries
  annotations:
    description: "Requires container images to begin with an approved registry prefix."
spec:
  crd:
    spec:
      names:
        kind: K8sTrustedRegistries
      validation:
        openAPIV3Schema:
          type: object
          properties:
            registries:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8strustedregistries

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not valid_registry(container.image, input.parameters.registries)
          msg := sprintf("Container '%v' uses unapproved image '%v'. Approved registries: %v", [container.name, container.image, input.parameters.registries])
        }

        valid_registry(image, registries) {
          registry := registries[_]
          startswith(image, registry)
        }
