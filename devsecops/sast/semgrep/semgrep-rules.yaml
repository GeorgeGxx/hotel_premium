# ==============================================================================
# Hotel Premium - Centralized Semgrep SAST Policy Ruleset
# Governed by Platform Security & DevSecOps Architecture
# Version: 1.0.0 | Target Languages: Go 1.26, TypeScript/React, Python 3.12
# ==============================================================================
rules:
  - id: hotel-go-no-hardcoded-hmac-secret
    message: "Hardcoded HMAC/JWT secret detected in Go source code. Inject credentials from Vault, External Secrets Operator, or environment variables."
    severity: ERROR
    languages:
      - go
    pattern: hmac.New($HASH, []byte("..."))
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH

  - id: hotel-go-no-tls-insecure-skip-verify
    message: "InsecureSkipVerify: true disables TLS certificate verification in Go HTTP clients."
    severity: ERROR
    languages:
      - go
    pattern: |
      &tls.Config{..., InsecureSkipVerify: true, ...}
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH

  - id: hotel-go-no-gorm-raw-sql-concat
    message: "Potential SQL injection via string concatenation in GORM Raw/Exec query. Use parameterized placeholders ($1 / ?)."
    severity: ERROR
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: $DB.Raw("..." + $VAR + "...")
          - pattern: $DB.Exec("..." + $VAR + "...")
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  - id: hotel-ts-js-no-eval
    message: "Use of eval() or Function() constructor introduces code injection risks and violates Content-Security-Policy."
    severity: ERROR
    languages:
      - typescript
      - javascript
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  - id: hotel-python-no-unsafe-subprocess-shell
    message: "Execution of subprocess with shell=True can lead to command injection. Pass command arguments as a list with shell=False."
    severity: ERROR
    languages:
      - python
    pattern: subprocess.$FUNC(..., shell=True, ...)
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  - id: hotel-python-no-unsafe-yaml-load
    message: "Avoid yaml.load() without SafeLoader; use yaml.safe_load() to prevent arbitrary code execution."
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern: yaml.load($DATA)
      - pattern-not: yaml.load($DATA, Loader=yaml.SafeLoader)
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
