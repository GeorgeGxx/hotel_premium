# ==============================================================================
# Red Hat OpenShift Service Mesh (RHOSSM / Maistra / Sail Operator)
# ServiceMeshMemberRoll: Registers Hotel Premium namespaces into the Mesh
# ==============================================================================
apiVersion: maistra.io/v1
kind: ServiceMeshMemberRoll
metadata:
  name: default
  namespace: istio-system
  labels:
    app.kubernetes.io/name: hotel-premium
    platform: openshift
spec:
  members:
    - dev
    - data
    - auth
