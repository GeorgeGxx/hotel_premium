# Hotel Premium Services Manifests for Minikube
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-postgres-init
  namespace: data
data:
  000001_init.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "btree_gist";
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: data
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/version: "18-alpine"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: "hotel_user"
            - name: POSTGRES_PASSWORD
              value: "hotel_password"
            - name: POSTGRES_DB
              value: "hotel_db"
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-scripts
          configMap:
            name: hotel-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
