apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:8.3.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "unset KAFKA_PORT; exec /etc/confluent/docker/run"
          env:
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.data.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kafka-logs"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_COMPRESSION_TYPE
              value: "lz4"
          ports:
            - containerPort: 9092
            - containerPort: 9093
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: data
spec:
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
  selector:
    app: kafka
---
# Hotel Premium Microservices in dev namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-service
  namespace: dev
  labels:
    app: room-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: room-service
  template:
    metadata:
      labels:
        app: room-service
        sidecar.istio.io/inject: "true"
    spec:
      enableServiceLinks: false
      serviceAccountName: hotel-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: room-service
          image: georgegxx/hotel-room-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: ROOM_SERVICE_PORT
              value: "8081"
            - name: DB_HOST
              value: "postgres.data.svc.cluster.local"
            - name: DB_USER
              value: "hotel_user"
            - name: DB_PASSWORD
              value: "hotel_password"
            - name: DB_NAME
              value: "hotel_db"
            - name: REDIS_HOST
              value: "redis.data.svc.cluster.local:6379"
            - name: REDIS_ADDR
              value: "redis.data.svc.cluster.local:6379"
            - name: APP_ENV
              value: "development"
            - name: OTEL_COLLECTOR_URL
              value: "alloy.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "room-service"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: room-service
  namespace: dev
spec:
  ports:
    - port: 8081
  selector:
    app: room-service
---
