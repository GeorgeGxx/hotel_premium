# Hotel Premium Microservices in 'dev' namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-service
  namespace: dev
  labels:
    app: room-service
    app.kubernetes.io/name: room-service
    app.kubernetes.io/part-of: hotel-premium
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: room-service
  template:
    metadata:
      labels:
        app: room-service
        version: v1
        sidecar.istio.io/inject: "true"
    spec:
      enableServiceLinks: false
      serviceAccountName: hotel-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: room-service
          image: georgegxx/hotel-room-service:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: ROOM_SERVICE_PORT
              value: "8081"
            - name: DB_HOST
              value: "postgres.data.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "hotel_user"
            - name: DB_PASSWORD
              value: "hotel_password"
            - name: DB_NAME
              value: "hotel_db"
            - name: REDIS_HOST
              value: "redis.data.svc.cluster.local:6379"
            - name: REDIS_ADDR
              value: "redis.data.svc.cluster.local:6379"
            - name: APP_ENV
              value: "development"
            - name: OTEL_COLLECTOR_URL
              value: "alloy.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "room-service"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
