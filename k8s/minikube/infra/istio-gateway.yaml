# ==============================================================================
# Istio 1.31.2 Zero-Trust Mesh & Kong North-South Integration — Hotel Premium
# - North-South: Istio Gateway routes external traffic exclusively to Kong v3.9.4
# - East-West: STRICT mTLS (PeerAuthentication), ISTIO_MUTUAL + Outlier Detection
#   (DestinationRule), and Least-Privilege AuthorizationPolicy
# ==============================================================================
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: hotel-gateway
  namespace: dev
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: hotel-routes
  namespace: dev
spec:
  hosts:
    - "*"
  gateways:
    - hotel-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: kong-proxy.dev.svc.cluster.local
            port:
              number: 8000
      timeout: 15s
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: gateway-error,connect-failure,refused-stream
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-strict-mtls
  namespace: dev
spec:
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: hotel-services-mtls
  namespace: dev
spec:
  host: "*.dev.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 20
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-kong-and-mesh-internal
  namespace: dev
spec:
  action: ALLOW
  rules:
    # Allow Istio IngressGateway -> Kong Gateway
    - from:
        - source:
            namespaces: ["istio-system"]
      to:
        - operation:
            ports: ["8000"]
    # Allow Kong Gateway and internal peer services in dev namespace
    - from:
        - source:
            namespaces: ["dev"]
      to:
        - operation:
            ports: ["80", "5173", "8000", "8081", "8082", "8083", "8084", "5432", "6379", "9092"]
    # Allow Prometheus & Alloy in observability namespace to scrape /metrics and health
    - from:
        - source:
            namespaces: ["observability"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/metrics", "/api/v1/health"]
