# OpenCost 1.121.3 (Helm Chart v2.5.32) Deployment in namespace opencost
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencost
  namespace: opencost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencost
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods", "namespaces", "persistentvolumes", "persistentvolumeclaims", "resourcequotas", "replicationcontrollers", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencost
subjects:
  - kind: ServiceAccount
    name: opencost
    namespace: opencost
roleRef:
  kind: ClusterRole
  name: opencost
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pricing-configs
  namespace: opencost
data:
  provider: "custom"
  description: "Minikube Local FinOps Pricing"
  CPU: "0.031611"
  spotCPU: "0.006655"
  RAM: "0.004237"
  spotRAM: "0.000892"
  GPU: "0.95"
  storage: "0.00005479"
  zoneNetworkEgress: "0.01"
  regionNetworkEgress: "0.01"
  internetNetworkEgress: "0.12"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencost
  namespace: opencost
  labels:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/version: "1.121.3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencost
        app.kubernetes.io/version: "1.121.3"
    spec:
      serviceAccountName: opencost
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencost
          image: ghcr.io/opencost/opencost:1.121.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: "http://prometheus-server.observability.svc.cluster.local:9090"
            - name: CLUSTER_ID
              value: "hotel-premium-local"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: configs-vol
              mountPath: /var/configs
            - name: tmp-vol
              mountPath: /tmp
          ports:
            - name: http-metrics
              containerPort: 9003
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: opencost-ui
          image: ghcr.io/opencost/opencost-ui:1.121.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-vol
              mountPath: /tmp
            - name: ui-cache-vol
              mountPath: /var/cache/nginx
            - name: ui-run-vol
              mountPath: /var/run
          env:
            - name: UI_PORT
              value: "7000"
            - name: API_SERVER
              value: "127.0.0.1"
            - name: API_PORT
              value: "9003"
          ports:
            - name: http-ui
              containerPort: 7000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 7000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: configs-vol
          emptyDir: {}
        - name: tmp-vol
          emptyDir: {}
        - name: ui-cache-vol
          emptyDir: {}
        - name: ui-run-vol
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opencost
  namespace: opencost
  labels:
    app.kubernetes.io/name: opencost
spec:
  type: ClusterIP
  ports:
    - name: http-ui
      port: 7000
      targetPort: 7000
    - name: metrics
      port: 9003
      targetPort: 9003
  selector:
    app.kubernetes.io/name: opencost
