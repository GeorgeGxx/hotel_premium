# OpenCost v2.5.32 Deployment in namespace opencost
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencost
  namespace: opencost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencost
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods", "namespaces", "persistentvolumes", "persistentvolumeclaims", "resourcequotas", "replicationcontrollers", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencost
subjects:
  - kind: ServiceAccount
    name: opencost
    namespace: opencost
roleRef:
  kind: ClusterRole
  name: opencost
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencost
  namespace: opencost
  labels:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/version: "v2.5.32"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencost
        app.kubernetes.io/version: "v2.5.32"
    spec:
      serviceAccountName: opencost
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: opencost
          image: ghcr.io/opencost/opencost:v2.5.32
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
          env:
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: "http://prometheus-server.observability.svc.cluster.local:9090"
            - name: CLUSTER_ID
              value: "hotel-premium-local"
            - name: LOG_LEVEL
              value: "info"
          ports:
            - name: http-metrics
              containerPort: 9003
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: opencost-ui
          image: ghcr.io/opencost/opencost-ui:v2.5.32
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
          env:
            - name: UI_PORT
              value: "7000"
            - name: API_SERVER
              value: "127.0.0.1"
            - name: API_PORT
              value: "9003"
          ports:
            - name: http-ui
              containerPort: 7000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 7000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: opencost
  namespace: opencost
  labels:
    app.kubernetes.io/name: opencost
spec:
  type: ClusterIP
  ports:
    - name: http-ui
      port: 7000
      targetPort: 7000
    - name: metrics
      port: 9003
      targetPort: 9003
  selector:
    app.kubernetes.io/name: opencost
