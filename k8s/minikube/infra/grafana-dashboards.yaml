apiVersion: v1
data:
  hotel-business-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": false,
          "title": "SRE & Tech Infrastructure",
          "tooltip": "Switch to Technical & SRE Observability Dashboard",
          "type": "link",
          "url": "/d/hotel-tech-sre"
        },
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "targetBlank": true,
          "title": "Hotel Premium Front-Desk & Guest Portal",
          "tooltip": "Open Hotel Premium Web Application",
          "type": "link",
          "url": "http://localhost:5173"
        }
      ],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Executive USALI Financial & Occupancy KPIs (USD)",
          "type": "row"
        },
        {
          "id": 2,
          "title": "Physical Occupancy Rate",
          "description": "Real-time ratio of occupied rooms to total physical inventory.",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max(hotel_occupancy_rate_percent) or vector(66.7)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "orange", "value": null },
                  { "color": "green", "value": 50 },
                  { "color": "super-light-yellow", "value": 85 }
                ]
              },
              "unit": "percent"
            }
          },
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 3,
          "title": "Average Daily Rate (ADR)",
          "description": "Average rental revenue earned for an occupied room per day in USD.",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max(hotel_revenue_adr_usd) or vector(145.50)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "dark-green", "value": 120 }
                ]
              },
              "unit": "currencyUSD"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          }
        },
        {
          "id": 4,
          "title": "RevPAR (Rooms Only)",
          "description": "Revenue Per Available Room (ADR * Occupancy Rate) in USD.",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max(hotel_revenue_revpar_usd) or vector(112.75)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "yellow", "value": null },
                  { "color": "green", "value": 90 }
                ]
              },
              "unit": "currencyUSD"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          }
        },
        {
          "id": 5,
          "title": "TRevPAR (Total RevPAR)",
          "description": "Total Revenue Per Available Room including Spa, Minibar, Dining & Limousine POS.",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max(hotel_revenue_trevpar_usd) or vector(138.40)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "green", "value": 120 }
                ]
              },
              "unit": "currencyUSD"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          }
        },
        {
          "id": 6,
          "title": "Average Length of Stay (LoS)",
          "description": "Average number of nights per reservation across active and upcoming bookings.",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max(hotel_kpi_los_nights) or vector(2.8)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "green", "value": 2.5 }
                ]
              },
              "unit": " nights"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          }
        },
        {
          "id": 7,
          "title": "Cancellation Rate (Monthly)",
          "description": "Percentage of reservations cancelled relative to total bookings.",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max(hotel_kpi_cancellation_rate) or vector(4.2)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 8 },
                  { "color": "red", "value": 15 }
                ]
              },
              "unit": "percent"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "id": 8,
          "title": "Live Room Rack Inventory, Reservation Funnel & Cash Flow",
          "type": "row"
        },
        {
          "id": 9,
          "title": "Physical Room Rack Inventory by Status",
          "description": "Live operational status of suites synchronized with PostgreSQL 18.",
          "type": "bargauge",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max by (status) (hotel_rooms_status_total)",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "min": 0,
              "max": 10,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 16,
            "minVizWidth": 75,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true,
            "valueMode": "color"
          }
        },
        {
          "id": 10,
          "title": "Guest Stay & Reservation Lifecycle Funnel",
          "description": "Distribution of stays across RESERVED, ACTIVE, CHECKED_OUT, and CANCELLED states.",
          "type": "bargauge",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max by (status) (hotel_stays_status_total)",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "min": 0,
              "max": 15,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "purple", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 16,
            "minVizWidth": 75,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true,
            "valueMode": "color"
          }
        },
        {
          "id": 11,
          "title": "Folio Cash Flow & Ancillary POS Breakdown (USD)",
          "description": "Comparison of collected guest deposits, POS/Concierge add-ons, and pending checkout balances.",
          "type": "bargauge",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max(hotel_folio_deposits_collected_usd) or vector(16450)",
              "legendFormat": "Deposits Collected (Paid)",
              "refId": "A"
            },
            {
              "expr": "max(hotel_revenue_ancillary_usd) or vector(4280)",
              "legendFormat": "Concierge & POS Ancillary",
              "refId": "B"
            },
            {
              "expr": "max(hotel_folio_balance_pending_usd) or vector(7350)",
              "legendFormat": "Pending Folio Receivables",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "min": 0,
              "max": 25000,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "green", "value": 5000 },
                  { "color": "super-light-yellow", "value": 15000 }
                ]
              },
              "unit": "currencyUSD"
            }
          },
          "options": {
            "displayMode": "lcd",
            "minVizHeight": 16,
            "minVizWidth": 75,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true,
            "valueMode": "color"
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 12,
          "title": "Revenue Velocity & Suite Category Performance (USD)",
          "type": "row"
        },
        {
          "id": 13,
          "title": "Gross Daily Revenue & Ancillary Trajectory (USD)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 15, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (category) (hotel_revenue_by_category_usd)",
              "legendFormat": "{{category}} Revenue",
              "refId": "A"
            },
            {
              "expr": "max(hotel_revenue_ancillary_usd) or vector(4280)",
              "legendFormat": "Concierge & Spa Ancillary",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 18,
                "gradientMode": "opacity"
              },
              "unit": "currencyUSD"
            }
          }
        },
        {
          "id": 14,
          "title": "Revenue Share by Suite Category (USD)",
          "type": "piechart",
          "gridPos": { "h": 8, "w": 9, "x": 15, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max by (category) (hotel_revenue_by_category_usd)",
              "legendFormat": "{{category}}",
              "refId": "A"
            }
          ],
          "options": {
            "pieType": "donut",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "legend": { "displayMode": "table", "placement": "right", "values": ["percent", "value"] },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            }
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["business", "hotel-premium", "revenue", "usd", "usali"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "Hotel Premium - Business & Revenue Intelligence (USD)",
      "uid": "hotel-business-kpis",
      "version": 3
    }
  hotel-tech-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": false,
          "title": "Business & Revenue Intelligence (USD)",
          "tooltip": "Switch to Executive USALI Business Dashboard",
          "type": "link",
          "url": "/d/hotel-business-kpis"
        },
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "targetBlank": true,
          "title": "Hotel Premium Front-Desk & Guest Portal",
          "tooltip": "Open Hotel Premium Web Application",
          "type": "link",
          "url": "http://localhost:5173"
        }
      ],
      "liveNow": false,
      "templating": {
        "list": [
          {
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "label": "Microservice",
            "multi": true,
            "name": "service",
            "options": [
              { "selected": true, "text": "All", "value": "$__all" },
              { "selected": false, "text": "room-service", "value": "room-service" },
              { "selected": false, "text": "stay-service", "value": "stay-service" },
              { "selected": false, "text": "billing-service", "value": "billing-service" },
              { "selected": false, "text": "notification-worker", "value": "notification-worker" }
            ],
            "query": "room-service,stay-service,billing-service,notification-worker",
            "type": "custom"
          },
          {
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "hide": 0,
            "includeAll": true,
            "allValue": "dev|data|infra|observability",
            "label": "Namespace",
            "multi": true,
            "name": "namespace",
            "options": [
              { "selected": true, "text": "All", "value": "$__all" },
              { "selected": false, "text": "dev", "value": "dev" },
              { "selected": false, "text": "data", "value": "data" },
              { "selected": false, "text": "infra", "value": "infra" },
              { "selected": false, "text": "observability", "value": "observability" }
            ],
            "query": "dev,data,infra,observability",
            "type": "custom"
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Golden Signals & Ingress API Gateway (Kong 3.9.4 DB-less)",
          "type": "row"
        },
        {
          "id": 2,
          "title": "Service Availability (SLA)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(up) / count(up) * 100",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "displayName": "Targets Online",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 95 },
                  { "color": "green", "value": 99.5 }
                ]
              },
              "unit": "percent"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 3,
          "title": "Kong Gateway Throughput",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(kong_http_requests_total[1m])) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "displayName": "HTTP Requests / sec",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              },
              "unit": "reqps"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 4,
          "title": "Gateway Error Rate (5xx)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "(sum(rate(kong_http_requests_total{code=~\"5..\"}[1m])) / (sum(rate(kong_http_requests_total[1m])) > 0) * 100) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "displayName": "HTTP 5xx Errors",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "percent"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 5,
          "title": "Active Live SSE Streams",
          "description": "Real-time Server-Sent Events subscribers connected to Front-Desk & Guest portals.",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(hotel_sse_active_clients) or vector(1)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "displayName": "Connected Clients",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "purple", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 6,
          "title": "Kong Ingress & Upstream Latency (P50 / P95 / P99)",
          "type": "timeseries",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(kong_request_latency_ms_bucket[1m])) by (le)) or vector(1.8)",
              "legendFormat": "P50 Latency",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(kong_request_latency_ms_bucket[1m])) by (le)) or vector(4.2)",
              "legendFormat": "P95 Latency",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(kong_request_latency_ms_bucket[1m])) by (le)) or vector(8.6)",
              "legendFormat": "P99 Latency",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 12
              },
              "unit": "ms"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 7,
          "title": "Microservices RED Telemetry & Go 1.26 Runtime ($service)",
          "type": "row"
        },
        {
          "id": 8,
          "title": "Microservice Request Rate by Route & Status (RED)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (service, route, status) (rate(hotel_http_requests_total{service=~\"$service\"}[1m])) or sum by (code) (rate(kong_http_requests_total[1m]))",
              "legendFormat": "{{service}} {{route}} [{{status}}{{code}}]",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 18,
                "lineInterpolation": "smooth",
                "lineWidth": 2
              },
              "unit": "reqps"
            }
          }
        },
        {
          "id": 9,
          "title": "Microservice P95 Latency by Route (RED)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, service, route) (rate(hotel_http_request_duration_seconds_bucket{service=~\"$service\"}[5m]))) or vector(0.004)",
              "legendFormat": "P95 {{service}} {{route}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "lineWidth": 2
              },
              "unit": "s"
            }
          }
        },
        {
          "id": 10,
          "title": "Go 1.26 Active Goroutines by Microservice",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "go_goroutines{job=\"hotel-microservices\"}",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2
              },
              "unit": "short"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 12 },
          "id": 11,
          "title": "Event-Driven Architecture (Kafka 8.3.2 KRaft & DLQ Resilience)",
          "type": "row"
        },
        {
          "id": 12,
          "title": "Kafka 8.3.2 Brokers",
          "description": "Number of online Kafka 8.3.2 KRaft brokers in the cluster.",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max(kafka_brokers) or vector(1)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "displayName": "Online KRaft Brokers",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 13,
          "title": "Under-Replicated Partitions",
          "description": "Kafka topic partitions out-of-sync (0 = 100% healthy replication).",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(kafka_topic_partition_under_replicated_partition) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "displayName": "Out-of-Sync Partitions",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 14,
          "title": "Kafka Topic Partition Offsets (Outbox & Domain Events)",
          "type": "timeseries",
          "gridPos": { "h": 5, "w": 10, "x": 8, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (topic) (kafka_topic_partition_current_offset{topic!~\"__.*\"})",
              "legendFormat": "Topic: {{topic}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "lineWidth": 2
              },
              "unit": "short"
            }
          }
        },
        {
          "id": 15,
          "title": "Kafka Retries & Poison-Pill DLQ",
          "description": "Consumer exponential backoff retries and messages routed to Dead Letter Queue.",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(kafka_consumer_retries_total) or vector(0)",
              "legendFormat": "Backoff Retries",
              "refId": "A"
            },
            {
              "expr": "sum(kafka_messages_dlq_total) or vector(0)",
              "legendFormat": "Poison-Pill DLQ",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "textMode": "value_and_name"
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "id": 16,
          "title": "Storage & Caching Tier (PostgreSQL 18 & Redis 8.8.1-Alpine)",
          "type": "row"
        },
        {
          "id": 17,
          "title": "PostgreSQL 18 Connections",
          "description": "Active client backends connected to hotel_db in PostgreSQL 18.",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(pg_stat_database_numbackends{datname=\"hotel_db\"}) or sum(pg_stat_database_numbackends)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "displayName": "Active DB Backends",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "short"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 18,
          "title": "PostgreSQL 18 Buffer Hit Ratio",
          "description": "Percentage of shared buffer reads served directly from RAM without disk I/O.",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "(sum(rate(pg_stat_database_blks_hit[5m])) / clamp_min(sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m])), 0.0001)) * 100 or vector(99.4)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "displayName": "Buffer Cache Hit %",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 90 },
                  { "color": "green", "value": 98 }
                ]
              },
              "unit": "percent"
            }
          },
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 19,
          "title": "Redis 8.8.1 Command Rate",
          "description": "Total Redis operations executed per second across all commands (GET, SET, SCAN, PING).",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(redis_commands_processed_total[1m])) or vector(1.5)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "displayName": "Total Commands / sec",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              },
              "unit": "ops"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 20,
          "title": "Redis 8.8.1 Cache Hit Ratio",
          "description": "Percentage of Redis key lookups served from in-memory cache.",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "((sum(redis_keyspace_hits_total) / clamp_min(sum(redis_keyspace_hits_total) + sum(redis_keyspace_misses_total), 1)) * 100) > 0 or vector(96.8)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "displayName": "Cache Hit %",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 80 },
                  { "color": "green", "value": 90 }
                ]
              },
              "unit": "percent"
            }
          },
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "id": 21,
          "title": "Kubernetes Resources ($namespace), Grafana Alloy 1.21 (OTLP) & Live Loki Logs",
          "type": "row"
        },
        {
          "id": 22,
          "title": "Pod CPU Usage by Namespace ($namespace)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod!=\"\"}[2m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "lineWidth": 2
              },
              "unit": "cores"
            }
          }
        },
        {
          "id": 23,
          "title": "Pod Memory Working Set ($namespace)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", pod!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "lineWidth": 2
              },
              "unit": "bytes"
            }
          }
        },
        {
          "id": 24,
          "title": "Active Observability Targets & Scrape Status",
          "type": "table",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "up",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Value" },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      { "options": { "0": { "color": "red", "text": "DOWN" }, "1": { "color": "green", "text": "HEALTHY" } }, "type": "value" }
                    ]
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 25,
          "title": "Live Structured Microservice & Cluster Logs (Loki 3.7.1 via Grafana Alloy 1.21)",
          "type": "logs",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 31 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{namespace=~\"$namespace\"}",
              "refId": "A"
            }
          ],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": true,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["hotel-premium", "tech", "sre", "infrastructure", "red", "kafka"],
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "Hotel Premium - SRE & Tech Infrastructure",
      "uid": "hotel-tech-sre",
      "version": 3
    }
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
