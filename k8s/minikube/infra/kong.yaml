apiVersion: v1
kind: ServiceAccount
metadata:
  name: kong-sa
  namespace: dev
  labels:
    app: kong-gateway
    app.kubernetes.io/part-of: hotel-premium
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: dev
data:
  kong.yaml: |
    _format_version: "3.0"
    upstreams:
      - name: room-upstream
        algorithm: round-robin
        healthchecks:
          active:
            type: http
            http_path: /api/v1/ready
            healthy:
              interval: 5
              http_statuses: [200]
              successes: 2
            unhealthy:
              interval: 2
              http_statuses: [429, 500, 503]
              http_failures: 3
              timeouts: 3
          passive:
            type: http
            healthy:
              http_statuses: [200, 201, 204]
              successes: 3
            unhealthy:
              http_statuses: [500, 502, 503]
              http_failures: 3
        targets:
          - target: room-service.dev.svc.cluster.local:8081
            weight: 100
      - name: stay-upstream
        algorithm: round-robin
        healthchecks:
          active:
            type: http
            http_path: /api/v1/ready
            healthy:
              interval: 5
              http_statuses: [200]
              successes: 2
            unhealthy:
              interval: 2
              http_statuses: [429, 500, 503]
              http_failures: 3
              timeouts: 3
          passive:
            type: http
            healthy:
              http_statuses: [200, 201, 204]
              successes: 3
            unhealthy:
              http_statuses: [500, 502, 503]
              http_failures: 3
        targets:
          - target: stay-service.dev.svc.cluster.local:8082
            weight: 100
      - name: billing-upstream
        algorithm: round-robin
        healthchecks:
          active:
            type: http
            http_path: /api/v1/ready
            healthy:
              interval: 5
              http_statuses: [200]
              successes: 2
            unhealthy:
              interval: 2
              http_statuses: [429, 500, 503]
              http_failures: 3
              timeouts: 3
          passive:
            type: http
            healthy:
              http_statuses: [200, 201, 204]
              successes: 3
            unhealthy:
              http_statuses: [500, 502, 503]
              http_failures: 3
        targets:
          - target: billing-service.dev.svc.cluster.local:8083
            weight: 100
      - name: notification-upstream
        algorithm: round-robin
        healthchecks:
          active:
            type: http
            http_path: /api/v1/ready
            healthy:
              interval: 5
              http_statuses: [200]
              successes: 2
            unhealthy:
              interval: 2
              http_statuses: [429, 500, 503]
              http_failures: 3
              timeouts: 3
        targets:
          - target: notification-worker.dev.svc.cluster.local:8084
            weight: 100
    services:
      - name: room-service
        host: room-upstream
        protocol: http
        port: 8081
        path: /
        connect_timeout: 5000
        read_timeout: 15000
        write_timeout: 15000
        retries: 2
        routes:
          - name: room-routes
            paths:
              - /api/v1/rooms
              - /api/v1/health
              - /api/v1/ready
            strip_path: false
            protocols:
              - http
              - https
      - name: stay-service
        host: stay-upstream
        protocol: http
        port: 8082
        path: /
        connect_timeout: 5000
        read_timeout: 3600000
        write_timeout: 30000
        retries: 1
        routes:
          - name: stay-routes
            paths:
              - /api/v1/stays
              - /api/v1/events/live
            strip_path: false
            protocols:
              - http
              - https
      - name: billing-service
        host: billing-upstream
        protocol: http
        port: 8083
        path: /
        connect_timeout: 5000
        read_timeout: 15000
        write_timeout: 15000
        retries: 1
        routes:
          - name: billing-routes
            paths:
              - /api/v1/billing
            strip_path: false
            protocols:
              - http
              - https
      - name: notification-worker
        host: notification-upstream
        protocol: http
        port: 8084
        path: /
        connect_timeout: 5000
        read_timeout: 15000
        write_timeout: 15000
        retries: 1
        routes:
          - name: notification-routes
            paths:
              - /api/v1/notifications
              - /api/v1/dlq
            strip_path: false
            protocols:
              - http
              - https
      - name: frontend-service
        url: http://hotel-frontend.dev.svc.cluster.local:80
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: frontend-routes
            paths:
              - /
            strip_path: false
            protocols:
              - http
              - https
    plugins:
      - name: prometheus
        config:
          per_consumer: false
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
          upstream_health_metrics: true
      - name: opentelemetry
        config:
          traces_endpoint: http://alloy.observability.svc.cluster.local:4318/v1/traces
          resource_attributes:
            service.name: kong-gateway
            service.version: "3.9.4"
          sampling_rate: 1.0
          queue:
            max_batch_size: 1
            max_coalescing_delay: 0.1
          propagation:
            default_format: w3c
            extract:
              - w3c
              - b3
            inject:
              - preserve
              - w3c
          http_response_header_for_traceid: X-Trace-Id
      - name: cors
        config:
          origins:
            - "http://localhost:5173"
            - "http://localhost:8000"
            - "http://localhost:80"
            - "http://localhost"
            - "https://hotel-premium.internal"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - Idempotency-Key
            - X-Idempotency-Key
            - X-User-Role
            - X-Correlation-ID
            - traceparent
            - tracestate
          exposed_headers:
            - Authorization
            - X-Trace-Id
            - X-Correlation-ID
            - traceparent
          credentials: true
          max_age: 3600
      - name: request-transformer
        config:
          remove:
            headers:
              - X-Gateway-Secret
      - name: rate-limiting
        config:
          second: 30
          minute: 120
          limit_by: ip
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: request-size-limiting
        config:
          allowed_payload_size: 10
          size_unit: megabytes
          require_content_length: false
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid#counter
          echo_downstream: true
      - name: response-transformer
        config:
          add:
            headers:
              - "X-Content-Type-Options: nosniff"
              - "X-Frame-Options: DENY"
              - "Referrer-Policy: strict-origin-when-cross-origin"
              - "Permissions-Policy: geolocation=(), microphone=(), camera=()"
              - "Strict-Transport-Security: max-age=31536000; includeSubDomains"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-gateway
  namespace: dev
  labels:
    app: kong-gateway
    app.kubernetes.io/name: kong-gateway
    app.kubernetes.io/part-of: hotel-premium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-gateway
  template:
    metadata:
      labels:
        app: kong-gateway
    spec:
      serviceAccountName: kong-sa
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kong
          image: kong:3.9.4
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_PREFIX
              value: /tmp/kong
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yaml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_LISTEN
              value: 127.0.0.1:8001
            - name: KONG_ADMIN_GUI_LISTEN
              value: 127.0.0.1:8002
            - name: KONG_ADMIN_GUI_URL
              value: http://localhost:8002
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
            - name: KONG_TRACING_INSTRUMENTATIONS
              value: "all"
            - name: KONG_TRACING_SAMPLING_RATE
              value: "1.0"
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "1"
          ports:
            - name: proxy
              containerPort: 8000
            - name: status
              containerPort: 8100
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong
              readOnly: true
            - name: kong-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /status
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: 8100
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: kong-config
          configMap:
            name: kong-declarative-config
        - name: kong-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: dev
  labels:
    app: kong-gateway
spec:
  type: LoadBalancer
  ports:
    - name: http-proxy
      port: 8000
      targetPort: 8000
    - name: status-metrics
      port: 8100
      targetPort: 8100
  selector:
    app: kong-gateway
