# KEDA v2.21.0 ScaledObject for Event-Driven Consumer Autoscaling (Primary + DLQ Triggers)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-worker-scaler
  namespace: dev
  labels:
    app.kubernetes.io/name: notification-worker-scaler
    app.kubernetes.io/part-of: hotel-premium
    app.kubernetes.io/managed-by: keda
    app.kubernetes.io/version: "v2.21.0"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 30
  pollingInterval: 10
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 15
          policies:
            - type: Pods
              value: 2
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Pods
              value: 1
              periodSeconds: 30
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.data.svc.cluster.local:9092
        consumerGroup: hotel-notification-workers
        topic: hotel.stays.lifecycle.v1
        lagThreshold: "10"
        activationLagThreshold: "1"
        offsetResetPolicy: latest
    - type: kafka
      metadata:
        bootstrapServers: kafka.data.svc.cluster.local:9092
        consumerGroup: hotel-notification-dlq-workers
        topic: hotel.stays.lifecycle.v1.DLQ
        lagThreshold: "5"
        activationLagThreshold: "1"
        offsetResetPolicy: latest
