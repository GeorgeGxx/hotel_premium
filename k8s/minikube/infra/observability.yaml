# Full Observability Stack (LGTM + Prometheus + Kiali) in namespace observability
# Prometheus v3.14.0 | Grafana v13.2.3 | Loki v3.7.8 | Tempo v3.0.5 | Alloy v1.21.0
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-server
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-server
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-server
subjects:
  - kind: ServiceAccount
    name: prometheus-server
    namespace: observability
roleRef:
  kind: ClusterRole
  name: prometheus-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  namespace: observability
data:
  alerts.yml: |
    groups:
      - name: hotel_premium_sre_alerts
        rules:
          - alert: HotelMicroserviceDown
            expr: up{job="hotel-microservices"} == 0
            for: 30s
            labels:
              severity: critical
              tier: application
            annotations:
              summary: "Microservice instance {{ $labels.instance }} is down"
              description: "Microservice {{ $labels.instance }} has been unreachable for more than 30 seconds."

          - alert: KongGatewayDown
            expr: up{job="kong-gateway"} == 0
            for: 30s
            labels:
              severity: page
              tier: gateway
            annotations:
              summary: "Kong API Gateway ingress is unreachable"
              description: "Kong API Gateway on {{ $labels.instance }} is down."

          - alert: KafkaHighConsumerLag
            expr: sum(kafka_consumergroup_lag{topic=~"hotel.*"}) by (consumergroup, topic) > 50
            for: 1m
            labels:
              severity: warning
              tier: messaging
            annotations:
              summary: "High Kafka consumer lag on group {{ $labels.consumergroup }}"
              description: "Kafka consumer group {{ $labels.consumergroup }} has lag > 50 messages on topic {{ $labels.topic }}."

          - alert: VaultInstanceDown
            expr: up{job="vault"} == 0
            for: 30s
            labels:
              severity: critical
              tier: security
            annotations:
              summary: "HashiCorp Vault instance is unreachable"
              description: "HashiCorp Vault on {{ $labels.instance }} is down or sealed."

          - alert: KongUpstreamTargetUnhealthy
            expr: kong_upstream_target_health{state="unhealthy"} > 0
            for: 15s
            labels:
              severity: warning
              tier: gateway
            annotations:
              summary: "Kong upstream target {{ $labels.target }} is UNHEALTHY"
              description: "Kong circuit breaker marked target {{ $labels.target }} in upstream {{ $labels.upstream }} as unhealthy."

          - alert: PostgresConnectionSaturation
            expr: (sum(pg_stat_database_numbackends) / 100) * 100 > 80
            for: 2m
            labels:
              severity: warning
              tier: database
            annotations:
              summary: "PostgreSQL active connections exceeding 80% capacity"
              description: "PostgreSQL active backend connections are nearing pool limits."
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    rule_files:
      - "/etc/prometheus/alerts.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kong-gateway'
        metrics_path: /metrics
        static_configs:
          - targets: ['kong-proxy.dev.svc.cluster.local:8001']

      - job_name: 'hotel-microservices'
        metrics_path: /metrics
        static_configs:
          - targets:
              - 'room-service.dev.svc.cluster.local:8081'
              - 'stay-service.dev.svc.cluster.local:8082'
              - 'billing-service.dev.svc.cluster.local:8083'
              - 'notification-worker.dev.svc.cluster.local:8084'

      - job_name: 'kafka-exporter'
        metrics_path: /metrics
        static_configs:
          - targets: ['kafka-exporter.data.svc.cluster.local:9308']

      - job_name: 'vault'
        metrics_path: /v1/sys/metrics
        params:
          format: ['prometheus']
        static_configs:
          - targets: ['vault.vault.svc.cluster.local:8200']

      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter.data.svc.cluster.local:9121']

      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter.data.svc.cluster.local:9187']

      - job_name: 'alloy'
        static_configs:
          - targets: ['alloy.observability.svc.cluster.local:3300']

      - job_name: 'opencost'
        static_configs:
          - targets: ['opencost.opencost.svc.cluster.local:9003']

      - job_name: 'kubernetes-nodes-cadvisor'
        scrape_interval: 15s
        scrape_timeout: 10s
        metrics_path: /metrics/cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__address__]
            action: replace
            regex: (.+)(?::\d+)
            replacement: ${1}:10250
            target_label: __address__
          - source_labels: [__meta_kubernetes_node_name]
            action: replace
            target_label: instance

      - job_name: 'istiod'
        metrics_path: /metrics
        static_configs:
          - targets: ['istiod.istio-system.svc.cluster.local:15014']

      - job_name: 'envoy-stats'
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: '.*-envoy-prom'
          - source_labels: [__address__, __meta_kubernetes_pod_container_port_number]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod_name
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-server
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus-server
    app.kubernetes.io/version: "v3.14.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-server
        app.kubernetes.io/version: "v3.14.0"
    spec:
      serviceAccountName: prometheus-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
            - "--web.enable-remote-write-receiver"
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus
            - name: prometheus-storage-volume
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: prometheus-config-volume
          configMap:
            defaultMode: 420
            name: prometheus-server-conf
        - name: prometheus-storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-server
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: prometheus-server
---
# Grafana Datasources Provisioning
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local:9090
        isDefault: true
        jsonData:
          httpMethod: POST
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
            - name: traceparent
              datasourceUid: tempo

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        jsonData:
          maxLines: 2000
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '(?:trace_id|traceId)=([a-f0-9]+)'
              name: TraceID
              url: "$${__value.raw}"
            - datasourceUid: tempo
              matcherRegex: '00-([a-f0-9]{32})-[a-f0-9]{16}-[a-f0-9]{2}'
              name: W3CTraceID
              url: "$${__value.raw}"

      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        uid: tempo
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-2m"
            spanEndTimeShift: "2m"
            filterByTraceID: true
            filterBySpanID: false
            tags:
              - key: service.name
                value: service_name
              - key: job
                value: job
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: "-2m"
            spanEndTimeShift: "2m"
            queries:
              - name: "Span Rate"
                query: 'sum(rate(traces_spanmetrics_calls_total{service_name=$$__service_name}[1m]))'
              - name: "Latency P95"
                query: 'histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{service_name=$$__service_name}[1m])) by (le))'
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          search:
            hide: false
          lokiSearch:
            datasourceUid: loki
---
# Grafana Dashboards Provider Provisioning
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Hotel Premium Dashboards'
        orgId: 1
        folder: 'Hotel Premium'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/json
---
# Grafana 13.2.3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: "13.2.3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/version: "13.2.3"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "traceqlEditor,correlations,flameGraph"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards/json
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: grafana
---
# Loki 3.7.8 Log Aggregator
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      reject_old_samples: false
      retention_period: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem
    analytics:
      reporting_enabled: false
---
