# Tempo 3.0.5 Distributed Tracing
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observability
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
        zipkin:
          endpoint: "0.0.0.0:9411"
    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: hotel-premium
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: http://prometheus-server.observability.svc.cluster.local:9090/api/v1/write
            send_exemplars: true
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
---
