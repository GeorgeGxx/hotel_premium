{{- range $key, $svc := .Values.services }}
{{- if eq $svc.name "hotel-frontend" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-frontend-config
  namespace: {{ $.Values.global.namespace | default "dev" }}
  labels:
    app: {{ $svc.name }}
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: hotel-premium
data:
  default.conf: |
    server {
        listen 80;
        listen [::]:80;
        listen 5173;
        listen [::]:5173;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            resolver 10.96.0.10 kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
            set $upstream_gw "http://kong-proxy.dev.svc.cluster.local:8000";
            proxy_pass $upstream_gw;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc.name }}-sa
  namespace: {{ $.Values.global.namespace | default "dev" }}
  labels:
    app: {{ $svc.name }}
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: hotel-premium
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.global.namespace | default "dev" }}
  labels:
    app: {{ $svc.name }}
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: hotel-premium
    {{- include "hotel-premium.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ $svc.name }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
        version: v1
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: {{ $svc.name }}-sa
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        {{- if eq $svc.name "hotel-frontend" }}
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        {{- else }}
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
            {{- if eq $svc.name "hotel-frontend" }}
            - containerPort: 5173
              name: dev
            {{- end }}
          env:
            {{- range $envKey, $envVal := $svc.env }}
            - name: {{ $envKey }}
              value: {{ $envVal | quote }}
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: {{ $svc.readinessPath }}
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $svc.livenessPath }}
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          {{- if eq $svc.name "hotel-frontend" }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          {{- end }}
      {{- if eq $svc.name "hotel-frontend" }}
      volumes:
        - name: nginx-conf
          configMap:
            name: hotel-frontend-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.global.namespace | default "dev" }}
  labels:
    app: {{ $svc.name }}
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: hotel-premium
spec:
  type: ClusterIP
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.targetPort }}
      protocol: TCP
      name: http
    {{- if eq $svc.name "hotel-frontend" }}
    - port: 5173
      targetPort: 5173
      protocol: TCP
      name: dev
    {{- end }}
  selector:
    app: {{ $svc.name }}
{{- if and $.Values.pdb $.Values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $svc.name }}-pdb
  namespace: {{ $.Values.global.namespace | default "dev" }}
spec:
  minAvailable: {{ $.Values.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      app: {{ $svc.name }}
{{- end }}
{{- if and $.Values.autoscaling $.Values.autoscaling.enabled (ne $svc.name "notification-worker") }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svc.name }}-hpa
  namespace: {{ $.Values.global.namespace | default "dev" }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svc.name }}
  minReplicas: {{ $.Values.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas | default 6 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage | default 75 }}
{{- end }}
{{- end }}
{{- if and .Values.networkPolicy .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hotel-default-mesh-network-policy
  namespace: {{ .Values.global.namespace | default "dev" }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              environment: {{ .Values.global.namespace | default "dev" }}
        - namespaceSelector:
            matchLabels:
              environment: observability
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
{{- end }}
