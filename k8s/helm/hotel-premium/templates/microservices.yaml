{{- $ns := .Values.global.namespace | default "dev" -}}
{{- $secretName := (and .Values.secrets .Values.secrets.secretName) | default "hotel-app-secrets" -}}
{{- if and .Values.migrations .Values.migrations.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hotel-db-migrator
  namespace: {{ $ns }}
  labels:
    app: hotel-db-migrator
    app.kubernetes.io/name: hotel-db-migrator
    app.kubernetes.io/part-of: hotel-premium
    {{- include "hotel-premium.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: hotel-db-migrator
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        {{- if not (or .Values.global.openshift (and .Values.openshift .Values.openshift.enabled)) }}
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migrator
          image: {{ include "hotel-premium.serviceImage" (dict "svc" .Values.services.stayService "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          args: ["-migrate"]
          env:
            - name: APP_ENV
              value: {{ .Values.services.stayService.env.APP_ENV | default "production" | quote }}
            - name: DB_HOST
              value: {{ .Values.services.stayService.env.DB_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.services.stayService.env.DB_PORT | quote }}
            - name: DB_NAME
              value: {{ .Values.services.stayService.env.DB_NAME | quote }}
            - name: DB_USER
              value: {{ .Values.services.stayService.env.DB_USER | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_PASSWORD
                  optional: true
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
              ephemeral-storage: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            runAsNonRoot: true
            {{- if not (or .Values.global.openshift (and .Values.openshift .Values.openshift.enabled)) }}
            runAsUser: 10001
            runAsGroup: 10001
            {{- end }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
{{- end }}
{{- range $key, $svc := .Values.services }}
{{- if eq $svc.name "hotel-frontend" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-frontend-config
  namespace: {{ $ns }}
  labels:
    app: {{ $svc.name }}
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: hotel-premium
data:
  default.conf: |
    server {
        listen 8080;
        listen [::]:8080;
        listen 5173;
        listen [::]:5173;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            resolver 10.96.0.10 kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
            set $upstream_gw "http://kong-proxy.{{ $ns }}.svc.cluster.local:8000";
            proxy_pass $upstream_gw;
            proxy_http_version 1.1;
            proxy_set_header Host kong-proxy.{{ $ns }}.svc.cluster.local;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc.name }}-sa
  namespace: {{ $ns }}
  labels:
    app: {{ $svc.name }}
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: hotel-premium
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $svc.name }}
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: hotel-premium
    {{- include "hotel-premium.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ $svc.name }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
        version: v1
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: {{ $svc.name }}-sa
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ $svc.name }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ $svc.name }}
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        {{- if not (or $.Values.global.openshift (and $.Values.openshift $.Values.openshift.enabled)) }}
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: {{ include "hotel-premium.serviceImage" (dict "svc" $svc "global" $.Values.global) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ $svc.targetPort | default $svc.port }}
              name: http
            {{- if eq $svc.name "hotel-frontend" }}
            - containerPort: 5173
              name: dev
            {{- end }}
          env:
            {{- range $envKey, $envVal := $svc.env }}
            - name: {{ $envKey }}
              value: {{ $envVal | quote }}
            {{- end }}
            {{- if ne $svc.name "hotel-frontend" }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_PASSWORD
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: JWT_SECRET
                  optional: true
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            {{- if not (or $.Values.global.openshift (and $.Values.openshift $.Values.openshift.enabled)) }}
            runAsUser: 10001
            runAsGroup: 10001
            {{- end }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: {{ $svc.livenessPath }}
              port: {{ $svc.targetPort | default $svc.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: {{ $svc.readinessPath }}
              port: {{ $svc.targetPort | default $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $svc.livenessPath }}
              port: {{ $svc.targetPort | default $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            {{- if eq $svc.name "hotel-frontend" }}
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: app-tmp
              mountPath: /tmp
            {{- else }}
            - name: app-tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        {{- if eq $svc.name "hotel-frontend" }}
        - name: nginx-conf
          configMap:
            name: hotel-frontend-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
        {{- else }}
        - name: app-tmp
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $svc.name }}
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: hotel-premium
spec:
  type: ClusterIP
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.targetPort }}
      protocol: TCP
      name: http
    {{- if eq $svc.name "hotel-frontend" }}
    - port: 5173
      targetPort: 5173
      protocol: TCP
      name: dev
    {{- end }}
  selector:
    app: {{ $svc.name }}
{{- if and $.Values.pdb $.Values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $svc.name }}-pdb
  namespace: {{ $ns }}
spec:
  minAvailable: {{ $.Values.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      app: {{ $svc.name }}
{{- end }}
{{- if and $.Values.autoscaling $.Values.autoscaling.enabled (ne $svc.name "notification-worker") }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svc.name }}-hpa
  namespace: {{ $ns }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svc.name }}
  minReplicas: {{ $.Values.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas | default 6 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage | default 75 }}
{{- end }}
{{- end }}
{{- if and .Values.networkPolicy .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hotel-default-mesh-network-policy
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              environment: {{ $ns }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
{{- end }}
