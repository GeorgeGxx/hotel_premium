# ==============================================================================
# HOTEL PREMIUM - POSTGRESQL 18 PRODUCTION CONFIGURATION
# Optimized for NVMe/SSD, High Concurrency, Modern Telemetry & SCRAM-SHA-256
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONNECTIONS & NETWORKING
# ------------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3
password_encryption = scram-sha-256

# ------------------------------------------------------------------------------
# 2. MEMORY & BUFFER POOL (Optimized for balanced containers)
# ------------------------------------------------------------------------------
shared_buffers = 256MB                  # 25% of container RAM allocation
effective_cache_size = 768MB            # 75% of container RAM allocation
maintenance_work_mem = 64MB
work_mem = 16MB                         # Per-operation sort & hash memory
huge_pages = try

# ------------------------------------------------------------------------------
# 3. WRITE-AHEAD LOG (WAL) & CHECKPOINTS (PostgreSQL 18 Modern Capabilities)
# ------------------------------------------------------------------------------
wal_level = replica
wal_compression = zstd                  # Modern zstd high-speed compression
wal_buffers = 16MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9      # Spread I/O over 90% of checkpoint duration
min_wal_size = 512MB
max_wal_size = 2GB
synchronous_commit = on

# ------------------------------------------------------------------------------
# 4. QUERY PLANNER & DISK I/O (Tuned for NVMe/SSD Storage)
# ------------------------------------------------------------------------------
random_page_cost = 1.1                  # 1.1 for SSD/NVMe (vs legacy 4.0 for HDD)
seq_page_cost = 1.0
effective_io_concurrency = 200          # Concurrent asynchronous I/O for SSDs
default_statistics_target = 100

# ------------------------------------------------------------------------------
# 5. PARALLEL WORKERS & MULTI-CORE UTILIZATION
# ------------------------------------------------------------------------------
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
max_parallel_workers = 4

# ------------------------------------------------------------------------------
# 6. OBSERVABILITY, METRICS & EXTENSIONS (PostgreSQL 18 Profiling)
# ------------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on
track_functions = pl
track_activity_query_size = 2048

# ------------------------------------------------------------------------------
# 7. LOGGING & SLOW QUERY AUDIT
# ------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 250        # Log slow queries taking >= 250ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# ------------------------------------------------------------------------------
# 8. LOCALE & ENCODING
# ------------------------------------------------------------------------------
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
