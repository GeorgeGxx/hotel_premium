name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  security-events: write

jobs:
  sast-gitleaks:
    name: SAST Secret Detection (Gitleaks 8.30.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks v8.30.1
        uses: gitleaks/gitleaks-action@eed89e83cf3cad1f4b7a420eb2a29cf05ddcbef4 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: devsecops/sast/gitleaks/.gitleaks.toml

  sast-semgrep:
    name: SAST Code Analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.110.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep Custom & OWASP Rules (Blocking)
        run: |
          semgrep scan --config devsecops/sast/semgrep/ --error

  iac-tflint:
    name: Terraform Format, Validate & TFLint (0.64.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e88815257a63414f0be0c31 # v3.1.2
        with:
          terraform_version: "1.10.5"

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive terraform/

      - name: Validate Terraform Environments (Stateless Init)
        run: |
          terraform -chdir=terraform/environments/local-minikube init -backend=false
          terraform -chdir=terraform/environments/local-minikube validate
          terraform -chdir=terraform/environments/aws init -backend=false
          terraform -chdir=terraform/environments/aws validate

      - name: Setup TFLint v0.64.0
        uses: terraform-linters/setup-tflint@80028157ab56a368bf38827cfa453c246f4b6a40 # v4.1.1
        with:
          tflint_version: "v0.64.0"

      - name: Init and Run TFLint (Blocking)
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/devsecops/iac/tflint/.tflint.hcl"
          tflint --chdir=terraform/environments/local-minikube --config "$GITHUB_WORKSPACE/devsecops/iac/tflint/.tflint.hcl"
          tflint --chdir=terraform/environments/aws --config "$GITHUB_WORKSPACE/devsecops/iac/tflint/.tflint.hcl"

  policy-conftest-opa:
    name: Helm Lint & OPA Policy Compliance (Conftest 0.56.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Helm 3.17.1
        uses: azure/setup-helm@b7246b12e77f7134765036f376114e91300022cd # v4.3.0
        with:
          version: "v3.17.1"

      - name: Lint Helm Chart across All Environments
        run: |
          helm lint k8s/helm/hotel-premium -f k8s/helm/hotel-premium/values-dev.yaml
          helm lint k8s/helm/hotel-premium -f k8s/helm/hotel-premium/values-staging.yaml
          helm lint k8s/helm/hotel-premium -f k8s/helm/hotel-premium/values-prod.yaml
          helm lint k8s/helm/hotel-premium -f k8s/helm/hotel-premium/values-openshift.yaml

      - name: Install Conftest 0.56.0
        run: |
          CONFTEST_VERSION="0.56.0"
          curl -sLO "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Validate Kubernetes Manifests & Helm Templates (Blocking)
        run: |
          conftest test k8s/minikube/services/*.yaml k8s/minikube/infra/*.yaml --policy devsecops/policies/conftest/
          helm template hotel-premium k8s/helm/hotel-premium -f k8s/helm/hotel-premium/values-prod.yaml > rendered-prod.yaml
          conftest test rendered-prod.yaml --policy devsecops/policies/conftest/

  trivy-and-sbom:
    name: Vulnerability Scan & CycloneDX SBOM (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy Vulnerability & Misconfig Scanner (Blocking)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: "fs"
          scanners: "vuln,misconfig,secret"
          trivyignores: "devsecops/compliance/trivy/.trivyignore"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: "fs"
          format: "cyclonedx"
          output: "sbom-hotel-premium.cdx.json"

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: hotel-premium-cyclonedx-sbom
          path: sbom-hotel-premium.cdx.json
          retention-days: 30

  backend-tests:
    name: Backend Unit, RBAC & Saga Orchestrator Tests (Go 1.26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go 1.26
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Run Go Vet & Race-Enabled Tests
        working-directory: backend
        run: |
          go vet ./...
          go test -v -race ./...

  frontend-tests:
    name: Frontend Type Check, Vitest & Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1e60f63919601466437e510c443e371b1e5b0259 # v4.0.2
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies, test and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
