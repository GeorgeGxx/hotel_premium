global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "kong-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8001"]

  - job_name: "hotel-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  - job_name: "hotel-microservices"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "room-service:8081"
          - "stay-service:8082"
          - "billing-service:8083"

  - job_name: "kafka-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka_exporter:9308"]

  - job_name: "vault"
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets: ["vault:8200"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:3300"]
