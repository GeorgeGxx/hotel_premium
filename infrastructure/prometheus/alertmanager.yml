global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "tier", "severity"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h
  receiver: "sre-default-webhook"
  routes:
    - matchers:
        - severity =~ "critical|page"
      receiver: "sre-critical-pager"
      group_wait: 5s

receivers:
  - name: "sre-default-webhook"
    webhook_configs:
      - url: "http://hotel-notification-worker:8084/api/v1/notifications"
        send_resolved: true

  - name: "sre-critical-pager"
    webhook_configs:
      - url: "http://hotel-notification-worker:8084/api/v1/notifications"
        send_resolved: true
