_format_version: "3.0"

# ==============================================================================
# UPSTREAMS (CIRCUIT BREAKING & HEALTH CHECKS)
# ==============================================================================
upstreams:
  - name: room-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /api/v1/ready
        healthy:
          interval: 5
          http_statuses: [200]
          successes: 2
        unhealthy:
          interval: 2
          http_statuses: [429, 500, 503]
          http_failures: 3
          timeouts: 3
      passive:
        type: http
        healthy:
          http_statuses: [200, 201, 204]
          successes: 3
        unhealthy:
          http_statuses: [500, 502, 503]
          http_failures: 3
    targets:
      - target: hotel-room-service:8081
        weight: 100

  - name: stay-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /api/v1/ready
        healthy:
          interval: 5
          http_statuses: [200]
          successes: 2
        unhealthy:
          interval: 2
          http_statuses: [429, 500, 503]
          http_failures: 3
          timeouts: 3
      passive:
        type: http
        healthy:
          http_statuses: [200, 201, 204]
          successes: 3
        unhealthy:
          http_statuses: [500, 502, 503]
          http_failures: 3
    targets:
      - target: hotel-stay-service:8082
        weight: 100

  - name: billing-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /api/v1/ready
        healthy:
          interval: 5
          http_statuses: [200]
          successes: 2
        unhealthy:
          interval: 2
          http_statuses: [429, 500, 503]
          http_failures: 3
          timeouts: 3
      passive:
        type: http
        healthy:
          http_statuses: [200, 201, 204]
          successes: 3
        unhealthy:
          http_statuses: [500, 502, 503]
          http_failures: 3
    targets:
      - target: hotel-billing-service:8083
        weight: 100

  - name: notification-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /api/v1/ready
        healthy:
          interval: 5
          http_statuses: [200]
          successes: 2
        unhealthy:
          interval: 2
          http_statuses: [429, 500, 503]
          http_failures: 3
          timeouts: 3
    targets:
      - target: hotel-notification-worker:8084
        weight: 100

  - name: frontend-upstream
    algorithm: round-robin
    targets:
      - target: hotel-frontend:80
        weight: 100

  - name: keycloak-upstream
    algorithm: round-robin
    targets:
      - target: keycloak:8080
        weight: 100

# ==============================================================================
# SERVICES & ROUTES (NORTH-SOUTH API GATEWAY)
# ==============================================================================
services:
  # 1. Frontend Web Ingress
  - name: frontend-service
    host: frontend-upstream
    protocol: http
    port: 80
    path: /
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 2
    routes:
      - name: frontend-root-route
        paths:
          - /
        strip_path: false
        protocols:
          - http
          - https

  # 2. Decoupled Microservice: Room Service
  - name: room-service
    host: room-upstream
    protocol: http
    port: 8081
    path: /
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 15000
    retries: 2
    routes:
      - name: room-routes
        paths:
          - /api/v1/rooms
          - /api/v1/health
          - /api/v1/ready
        strip_path: false
        protocols:
          - http
          - https

  # 3. Decoupled Microservice: Stay, Reservations & Real-Time SSE Service
  - name: stay-service
    host: stay-upstream
    protocol: http
    port: 8082
    path: /
    connect_timeout: 5000
    read_timeout: 3600000
    write_timeout: 30000
    retries: 1
    routes:
      - name: stay-routes
        paths:
          - /api/v1/stays
          - /api/v1/events/live
        strip_path: false
        protocols:
          - http
          - https

  # 4. Decoupled Microservice: Billing & POS Service
  - name: billing-service
    host: billing-upstream
    protocol: http
    port: 8083
    path: /
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 15000
    retries: 1
    routes:
      - name: billing-routes
        paths:
          - /api/v1/billing
        strip_path: false
        protocols:
          - http
          - https

  # 5. Decoupled Microservice: Notification Worker & DLQ Admin
  - name: notification-worker
    host: notification-upstream
    protocol: http
    port: 8084
    path: /
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 15000
    retries: 1
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
          - /api/v1/dlq
        strip_path: false
        protocols:
          - http
          - https

  # 6. Identity & Access Management (Keycloak OIDC Public Endpoints Only - No /admin exposed)
  - name: keycloak-service
    host: keycloak-upstream
    protocol: http
    port: 8080
    path: /
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 2
    routes:
      - name: keycloak-auth-route
        paths:
          - /auth
          - /realms
          - /resources
          - /js
        strip_path: false
        protocols:
          - http
          - https

# ==============================================================================
# ENTERPRISE GATEWAY PLUGINS
# ==============================================================================
plugins:
  # 1. Prometheus Telemetry Plugin
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  # 2. OpenTelemetry Tracing Plugin (W3C TraceContext -> Grafana Alloy -> Tempo)
  - name: opentelemetry
    config:
      traces_endpoint: http://alloy:4318/v1/traces
      resource_attributes:
        service.name: kong-gateway
        service.version: "3.9.4"
      sampling_rate: 1.0
      queue:
        max_batch_size: 1
        max_coalescing_delay: 0.1
      propagation:
        default_format: w3c
        extract:
          - w3c
          - b3
        inject:
          - preserve
          - w3c
      http_response_header_for_traceid: X-Trace-Id

  # 3. Cross-Origin Resource Sharing (CORS - Explicit Origin Allowlist)
  - name: cors
    config:
      origins:
        - "http://localhost:5173"
        - "http://localhost:8000"
        - "http://localhost:80"
        - "http://localhost"
        - "https://hotel-premium.internal"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-Type
        - Authorization
        - X-User-Role
        - Idempotency-Key
        - X-Idempotency-Key
        - X-Correlation-ID
        - traceparent
        - tracestate
      exposed_headers:
        - Authorization
        - X-Trace-Id
        - X-Correlation-ID
        - traceparent
      credentials: true
      max_age: 3600

  # 4. Inbound Header Sanitization (Prevent Client Gateway-Secret Spoofing)
  - name: request-transformer
    config:
      remove:
        headers:
          - X-Gateway-Secret

  # 5. Global Anti-DoS Rate Limiting
  - name: rate-limiting
    config:
      second: 30
      minute: 120
      limit_by: ip
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # 6. Request Size Limiting (10 MB max payload protection)
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
      require_content_length: false

  # 7. Correlation ID Injection
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid#counter
      echo_downstream: true

  # 8. Defensive HTTP Security Response Headers
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: DENY"
          - "Referrer-Policy: strict-origin-when-cross-origin"
          - "Permissions-Policy: geolocation=(), microphone=(), camera=()"
          - "Strict-Transport-Security: max-age=31536000; includeSubDomains"
