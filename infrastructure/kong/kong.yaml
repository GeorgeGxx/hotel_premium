_format_version: "3.0"

services:
  # 1. Frontend Web Ingress
  - name: frontend-service
    url: http://frontend:80
    routes:
      - name: frontend-root-route
        paths:
          - /
        strip_path: false
        protocols:
          - http
          - https

  # 2. Decoupled Microservice: Room Service
  - name: room-service
    url: http://room-service:8081
    routes:
      - name: room-routes
        paths:
          - /api/v1/rooms
        strip_path: false
        protocols:
          - http
          - https

  # 3. Decoupled Microservice: Stay & Reservation Service
  - name: stay-service
    url: http://stay-service:8082
    routes:
      - name: stay-routes
        paths:
          - /api/v1/stays
        strip_path: false
        protocols:
          - http
          - https

  # 4. Decoupled Microservice: Billing & POS Service
  - name: billing-service
    url: http://billing-service:8083
    routes:
      - name: billing-routes
        paths:
          - /api/v1/billing
        strip_path: false
        protocols:
          - http
          - https

  # 5. Fallback Core Backend Ingress
  - name: backend-service
    url: http://backend:8080
    routes:
      - name: backend-api-route
        paths:
          - /api
        strip_path: false
        protocols:
          - http
          - https

  # 6. Identity & Access Management (Keycloak)
  - name: keycloak-service
    url: http://keycloak:8080
    routes:
      - name: keycloak-auth-route
        paths:
          - /auth
          - /realms
          - /resources
          - /js
          - /admin
        strip_path: false
        protocols:
          - http
          - https

plugins:
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  - name: opentelemetry
    config:
      endpoint: http://otel-collector:4318/v1/traces
      resource_attributes:
        service.name: kong-api-gateway
        service.version: "3.14.0.16"

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-Type
        - Authorization
        - traceparent
        - tracestate
      exposed_headers:
        - Authorization
        - traceparent
      credentials: true
      max_age: 3600
