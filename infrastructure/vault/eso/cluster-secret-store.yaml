apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-cluster-store
  annotations:
    description: "Enterprise HashiCorp Vault Secret Engine Store for Hotel Premium"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleId: "hotel-backend-role-id"
          secretRef:
            name: vault-approle-secret
            key: secret-id
            namespace: external-secrets
