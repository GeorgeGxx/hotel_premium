apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-cluster-store
  annotations:
    description: "Enterprise HashiCorp Vault 2.0.x Secret Engine Store for Hotel Premium"
spec:
  provider:
    vault:
      server: "http://vault:8200"
      path: "secret"
      version: "v2"
      auth:
        # Option A: AppRole Authentication (Standard CI/CD & Multi-cloud)
        appRole:
          path: "approle"
          roleId: "hotel-backend-role-id"
          secretRef:
            name: vault-approle-secret
            key: secret-id
            namespace: external-secrets
        # Option B: Kubernetes Native ServiceAccount Auth (Uncomment for EKS/GKE/Kube)
        # kubernetes:
        #   mountPath: "kubernetes"
        #   role: "hotel-backend-role"
        #   serviceAccountRef:
        #     name: hotel-backend-sa
