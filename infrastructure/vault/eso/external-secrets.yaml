apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hotel-premium-secrets
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: hotel-premium-env-secret
    creationPolicy: Owner
  data:
    # Database Secrets
    - secretKey: DB_USER
      remoteRef:
        key: hotel-premium/database
        property: db_user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: hotel-premium/database
        property: db_password
    - secretKey: DB_NAME
      remoteRef:
        key: hotel-premium/database
        property: db_name
    
    # Keycloak Client Secrets
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: hotel-premium/keycloak
        property: client_secret
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: hotel-premium/keycloak
        property: admin_password

    # JWT & Auth Secrets
    - secretKey: JWT_SECRET
      remoteRef:
        key: hotel-premium/jwt
        property: secret

    # Kafka Connection
    - secretKey: KAFKA_BOOTSTRAP_SERVERS
      remoteRef:
        key: hotel-premium/kafka
        property: bootstrap_servers
